[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Supabase anon key and URL are intentionally exposed in frontend bundles.
  # They are safe behind Supabase Row Level Security.
  SECRETS_SCAN_OMIT_KEYS = "VITE_SUPABASE_ANON_KEY,VITE_SUPABASE_URL"

# SPA fallback: serve index.html for all routes so React Router handles them
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
